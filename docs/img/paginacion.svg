<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d1b18"/></marker>
  </defs>
  <rect width="760" height="430" rx="10" fill="#fdfbf7" stroke="#d9d3c5"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1b18">Paginación de dos niveles en ARMv7 (páginas de 4 KiB)</text>

  <!-- virtual address -->
  <text x="30" y="62" fill="#6b665d">Dirección virtual de 32 bits, ejemplo: 0x70F50000 (código de la Tarea 1)</text>
  <rect x="30" y="72" width="240" height="40" fill="#f0dcd2" stroke="#b4441c"/>
  <rect x="270" y="72" width="160" height="40" fill="#dde6f0" stroke="#3d5a80"/>
  <rect x="430" y="72" width="300" height="40" fill="#ece7db" stroke="#6b665d"/>
  <text x="150" y="97" text-anchor="middle" fill="#1d1b18">bits [31:20] · índice L1</text>
  <text x="350" y="97" text-anchor="middle" fill="#1d1b18">[19:12] · índice L2</text>
  <text x="580" y="97" text-anchor="middle" fill="#1d1b18">[11:0] · offset dentro de la página</text>
  <text x="150" y="130" text-anchor="middle" fill="#b4441c" font-family="monospace">0x70F = 1807</text>
  <text x="350" y="130" text-anchor="middle" fill="#3d5a80" font-family="monospace">0x50 = 80</text>
  <text x="580" y="130" text-anchor="middle" fill="#6b665d" font-family="monospace">0x000</text>

  <!-- TTBR0 -->
  <rect x="30" y="170" width="110" height="46" rx="4" fill="#1d1b18"/>
  <text x="85" y="190" text-anchor="middle" fill="#fdfbf7" font-weight="600">TTBR0</text>
  <text x="85" y="207" text-anchor="middle" fill="#d9d3c5" font-size="11">base de la tabla L1</text>
  <line x1="140" y1="193" x2="200" y2="193" stroke="#1d1b18" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- L1 table -->
  <rect x="205" y="150" width="150" height="230" fill="#fdfbf7" stroke="#b4441c" stroke-width="1.6"/>
  <text x="280" y="170" text-anchor="middle" font-weight="600" fill="#b4441c">Tabla L1</text>
  <text x="280" y="186" text-anchor="middle" font-size="11" fill="#6b665d">4096 entradas · 16 KiB</text>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#6b665d">cada una cubre 1 MiB</text>
  <g font-family="monospace" font-size="11" fill="#1d1b18">
    <line x1="205" y1="212" x2="355" y2="212" stroke="#d9d3c5"/>
    <text x="215" y="228">[0]     → L2 (vectores)</text>
    <text x="215" y="248">[1792]  → L2 (kernel)</text>
    <line x1="205" y1="256" x2="355" y2="256" stroke="#d9d3c5"/>
    <rect x="205.8" y="290" width="148.4" height="22" fill="#f0dcd2"/>
    <text x="215" y="305" font-weight="600">[1807]  → L2 tarea 1</text>
    <text x="215" y="335">bits[1:0] = 01</text>
    <text x="215" y="350">= "apunta a tabla L2"</text>
  </g>
  <line x1="355" y1="301" x2="415" y2="301" stroke="#1d1b18" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- L2 table -->
  <rect x="420" y="150" width="150" height="230" fill="#fdfbf7" stroke="#3d5a80" stroke-width="1.6"/>
  <text x="495" y="170" text-anchor="middle" font-weight="600" fill="#3d5a80">Tabla L2</text>
  <text x="495" y="186" text-anchor="middle" font-size="11" fill="#6b665d">256 entradas · 1 KiB</text>
  <text x="495" y="200" text-anchor="middle" font-size="11" fill="#6b665d">cada una cubre 4 KiB</text>
  <g font-family="monospace" font-size="11" fill="#1d1b18">
    <line x1="420" y1="212" x2="570" y2="212" stroke="#d9d3c5"/>
    <text x="430" y="228">[79]  ...</text>
    <rect x="420.8" y="238" width="148.4" height="22" fill="#dde6f0"/>
    <text x="430" y="253" font-weight="600">[80]  0x70F50000|0x32</text>
    <text x="430" y="278">[81]  ...</text>
    <text x="430" y="320">0x32 = página de 4 KiB</text>
    <text x="430" y="335">AP=11 → usuario R/W</text>
    <text x="430" y="350">0x12 → solo privilegiado</text>
  </g>
  <line x1="570" y1="249" x2="625" y2="249" stroke="#1d1b18" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- frame -->
  <rect x="630" y="200" width="105" height="100" fill="#ece7db" stroke="#6b665d" stroke-width="1.6"/>
  <text x="682" y="235" text-anchor="middle" font-weight="600" fill="#1d1b18">Marco de</text>
  <text x="682" y="252" text-anchor="middle" font-weight="600" fill="#1d1b18">página física</text>
  <text x="682" y="272" text-anchor="middle" font-size="11" fill="#6b665d">4 KiB + offset</text>
  <text x="682" y="288" text-anchor="middle" font-size="11" font-family="monospace" fill="#6b665d">0x70F50000</text>

  <text x="380" y="410" text-anchor="middle" font-size="12" fill="#6b665d">Cada tarea tiene su propia tabla L1 (su propio TTBR0): la misma dirección virtual puede resolverse distinto, o dar error, según quién la use.</text>
</svg>
